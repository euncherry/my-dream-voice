<rect x="60" y="40" width="220" height="80" rx="40" fill="#e4ebfb" stroke="#2f5fd0" stroke-width="3"/><text x="170" y="94" font-size="38" font-weight="700" fill="#2f5fd0" text-anchor="middle">경찰</text><circle cx="1360" cy="80" r="16" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="4"/><circle cx="1420" cy="80" r="16" fill="#fff" stroke="#2f5fd0" stroke-width="4"/><text x="1460" y="93" font-size="36" font-weight="800" fill="#2f5fd0" text-anchor="start">문장 1 / 2</text><rect x="60" y="160" width="1800" height="470" rx="24" fill="#eef0f3" stroke="#b7bcc5" stroke-width="3"/><text x="570" y="330" font-size="48" font-weight="700" fill="#6b707a" text-anchor="middle">시나리오 장면</text><text x="570" y="390" font-size="30" font-weight="400" fill="#6b707a" text-anchor="middle">그림 · 애니메이션 · 내레이션으로 직업 이야기가 흘러갑니다</text><rect x="120" y="480" width="760" height="110" rx="30" fill="#fff" stroke="#6b707a" stroke-width="3"/><text x="500" y="548" font-size="30" font-weight="400" fill="#2b2f36" text-anchor="middle">"출동 신호가 왔어요! 경찰관, 외쳐 볼까요?"</text><rect x="60" y="660" width="1800" height="380" rx="28" fill="#fff" stroke="#2f5fd0" stroke-width="6"/><rect x="100" y="690" width="300" height="64" rx="32" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="3"/><text x="250" y="734" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">내 차례!</text><text x="440" y="734" font-size="32" font-weight="400" fill="#6b707a" text-anchor="start">따라 말해 보세요</text><circle cx="225" cy="880" r="80" fill="#fbe6e6" stroke="#c23b3b" stroke-width="6"/><rect x="203" y="825" width="44" height="80" rx="22" fill="#c23b3b" stroke="#c23b3b" stroke-width="3"/><path d="M185 890 q0 40 40 40 q40 0 40 -40 M225 930 v22" fill="none" stroke="#c23b3b" stroke-width="6" stroke-linecap="round"/><rect x="330" y="865" width="12" height="30" rx="6" fill="#c23b3b" stroke="#c23b3b" stroke-width="1"/><rect x="352" y="853" width="12" height="54" rx="6" fill="#c23b3b" stroke="#c23b3b" stroke-width="1"/><rect x="374" y="840" width="12" height="80" rx="6" fill="#c23b3b" stroke="#c23b3b" stroke-width="1"/><rect x="396" y="853" width="12" height="54" rx="6" fill="#c23b3b" stroke="#c23b3b" stroke-width="1"/><rect x="418" y="865" width="12" height="30" rx="6" fill="#c23b3b" stroke="#c23b3b" stroke-width="1"/><text x="225" y="1000" font-size="30" font-weight="700" fill="#c23b3b" text-anchor="middle">녹음 중</text><text x="920" y="905" font-size="76" font-weight="800" fill="#2b2f36" text-anchor="middle">"출동! 사건 현장으로!"</text><rect x="1470" y="895" width="350" height="115" rx="28" fill="#2b2f36" stroke="#2b2f36" stroke-width="3"/><text x="1645" y="970.5" font-size="50" font-weight="700" fill="#fff" text-anchor="middle">다 말했어요</text><rect x="1100" y="185" width="740" height="138" rx="12" fill="#fbf3e4" stroke="#a86a00" stroke-width="2" stroke-dasharray="10 8"/><text x="1130" y="237" font-size="32" font-weight="700" fill="#a86a00" text-anchor="start">녹음하는 동안 시나리오 · 효과음은 멈춥니다</text><text x="1130" y="281" font-size="28" font-weight="400" fill="#a86a00" text-anchor="start">[다 말했어요]로 끝 (제한 시간은 나중에)</text>
<rect x="1670" y="20" width="230" height="56" rx="10" fill="#fbf3e4" stroke="#a86a00" stroke-width="2"/><text x="1785" y="58.08" font-size="28" font-weight="700" fill="#a86a00" text-anchor="middle">구성 스케치</text>
</svg>
