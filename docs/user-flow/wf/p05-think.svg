<rect x="60" y="40" width="220" height="80" rx="40" fill="#e4ebfb" stroke="#2f5fd0" stroke-width="3"/><text x="170" y="94" font-size="38" font-weight="700" fill="#2f5fd0" text-anchor="middle">경찰</text><circle cx="1360" cy="80" r="16" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="4"/><circle cx="1420" cy="80" r="16" fill="#fff" stroke="#2f5fd0" stroke-width="4"/><text x="1460" y="93" font-size="36" font-weight="800" fill="#2f5fd0" text-anchor="start">문장 1 / 2</text><rect x="60" y="160" width="1800" height="470" rx="24" fill="#eef0f3" stroke="#b7bcc5" stroke-width="3"/><text x="570" y="330" font-size="48" font-weight="700" fill="#6b707a" text-anchor="middle">시나리오 장면</text><text x="570" y="390" font-size="30" font-weight="400" fill="#6b707a" text-anchor="middle">그림 · 애니메이션 · 내레이션으로 직업 이야기가 흘러갑니다</text><rect x="120" y="480" width="760" height="110" rx="30" fill="#fff" stroke="#6b707a" stroke-width="3"/><text x="500" y="548" font-size="30" font-weight="400" fill="#2b2f36" text-anchor="middle">"출동 신호가 왔어요! 경찰관, 외쳐 볼까요?"</text><rect x="60" y="660" width="1800" height="380" rx="28" fill="#fff" stroke="#2f5fd0" stroke-width="6"/><rect x="100" y="690" width="300" height="64" rx="32" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="3"/><text x="250" y="734" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">내 차례!</text><rect x="110" y="780" width="230" height="230" rx="24" fill="#eef0f3" stroke="#b7bcc5" stroke-width="3"/><text x="225" y="880" font-size="30" font-weight="700" fill="#6b707a" text-anchor="middle">SD 캐릭터</text><text x="225" y="922" font-size="24" font-weight="400" fill="#6b707a" text-anchor="middle">(고민하는 표정)</text><text x="318" y="835" font-size="70" font-weight="800" fill="#a86a00">?</text><rect x="400" y="800" width="760" height="150" rx="30" fill="#fff" stroke="#6b707a" stroke-width="3"/><path d="M402 880 l-34 24 l34 6" fill="#fff" stroke="#6b707a" stroke-width="3"/><text x="780" y="895" font-size="54" font-weight="800" fill="#2b2f36" text-anchor="middle">잘 듣고 있어요…</text><circle cx="1250" cy="876" r="16" fill="#2f5fd0"/><circle cx="1300" cy="876" r="16" fill="#b7bcc5"/><circle cx="1350" cy="876" r="16" fill="#b7bcc5"/><rect x="1100" y="185" width="740" height="182" rx="12" fill="#fbf3e4" stroke="#a86a00" stroke-width="2" stroke-dasharray="10 8"/><text x="1130" y="237" font-size="32" font-weight="700" fill="#a86a00" text-anchor="start">뒤에서 받아쓰기 (faster-whisper, 평균 2.5~4초)</text><text x="1130" y="281" font-size="28" font-weight="400" fill="#a86a00" text-anchor="start">목표 문장과 글자 단위로 비교 (CER)</text><text x="1130" y="325" font-size="28" font-weight="400" fill="#a86a00" text-anchor="start">최소 1초 보여 줌 · 8초 넘으면 통과</text>
